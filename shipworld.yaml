schema: 1
remote: origin
batch-commit: "release: {targets}"

targets:
  tinest:
    # The build number is what Apple and Android increment per release, and
    # `flutter-application` is the kind that bumps it.
    kind: flutter-application
    # Rooted at the repository so the daemon's version file stays in reach of
    # the app's pubspec, which is the single source of truth.
    root: .
    version:
      source: packages/app/pubspec.yaml
      synchronized:
        - type: dart-constant
          path: packages/app/lib/src/app/version.g.dart
        - type: dart-constant
          path: packages/daemon/lib/src/bootstrap/version.g.dart
        - type: dart-constant
          path: packages/cli/lib/src/version.g.dart
    tag: "v{version}"
    commit: "release: v{version}"
    branch: main
    payload:
      # The Linux launcher; macOS and Windows override it per platform because
      # their bundles nest the executable differently.
      kind: directory
      launcher: tinest
    product:
      name: tinest
      display-name: Tinest
      description: Local-first AI coding agent with an always-on daemon
      executable: tinest
      homepage: https://github.com/tinyrack-net/tinest
      repository: tinyrack-net/tinest
    windows:
      application-id: Tinest
      executable: tinest.exe
      background-color: "#0a0a0a"
      identity:
        name-env: MSIX_IDENTITY_NAME
        publisher-env: MSIX_PUBLISHER
        publisher-display-name-env: MSIX_PUBLISHER_DISPLAY_NAME
        display-name-env: MSIX_DISPLAY_NAME
    macos:
      entitlements: packages/desktop_app/macos/Runner/Release.entitlements
      bundle-name: Tinest
      bundle-id: net.tinyrack.tinest
      # SMAppService, used for the login item, needs macOS 13.
      minimum-version: ventura
    linux:
      icon: packages/desktop_app/assets/brand/tinest.svg
      categories:
        - Development
      terminal: false
      maintainer: "Tinyrack <dev@tinyrack.net>"
      license: MIT
      vendor: Tinyrack
      app-id: net.tinyrack.tinest
      icons:
        - { size: 0, path: packages/desktop_app/assets/brand/tinest.svg }
        - { size: 128, path: packages/desktop_app/assets/brand/tinest-128.png }
        - { size: 256, path: packages/desktop_app/assets/brand/tinest-256.png }
        - { size: 512, path: packages/desktop_app/assets/brand/tinest-512.png }
      deb:
        # GTK is the Flutter shell; the indicator library backs the tray icon.
        # Ubuntu 24.04 renamed libgtk-3-0 during the time_t transition.
        depends:
          - libgtk-3-0t64
          - libayatana-appindicator3-1
        section: devel
      rpm:
        requires:
          - gtk3
          - libayatana-appindicator-gtk3
        release: "1"
        group: Development/Tools

  tinest-cli:
    kind: cli-application
    root: .
    version:
      # The CLI rides the application's version and tag so that one release
      # ships a matching daemon, desktop app, and command line. Its version
      # file is written by the `tinest` target above, which is why nothing is
      # synchronized here.
      source: packages/app/pubspec.yaml
    tag: "v{version}"
    commit: "release: v{version}"
    branch: main
    payload:
      # A directory rather than a bare executable: hosting the daemon links
      # sqlite3 and the PTY code assets, so `dart build cli` emits `bin/` plus
      # the `lib/` the executable loads at runtime.
      kind: directory
      launcher: tinest-cli
    product:
      name: tinest-cli
      display-name: Tinest CLI
      description: Command line that hosts and administers a Tinest daemon
      executable: tinest-cli
      homepage: https://github.com/tinyrack-net/tinest
      repository: tinyrack-net/tinest
    macos:
      entitlements: packages/cli/macos/Release.entitlements
      bundle-id: net.tinyrack.tinest.cli
    homebrew:
      # No Linux arm64: building the CLI needs the Flutter SDK, because it
      # shares a pub workspace with the app, and Flutter publishes no Linux
      # arm64 SDK. Claiming it would point the Formula at an artifact the
      # release does not carry.
      platforms:
        - macos-arm64
        - macos-x64
        - linux-x64
      formula-class: TinestCli
      # shipworld reads `<prefix>-<platform>-<arch>` bare executables from the
      # artifacts directory and installs them under this name.
      artifact-prefix: tinest-cli

  relay:
    # The relay server ships only as a container and therefore owns a release
    # cycle independent of the desktop application and command-line client.
    kind: cli-application
    root: .
    version:
      source: packages/relay/pubspec.yaml
    tag: "relay-v{version}"
    commit: "release: relay-v{version}"
    branch: main
