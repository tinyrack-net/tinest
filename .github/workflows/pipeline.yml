name: CI/CD Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      package_release:
        description: Build release packages without publishing a GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2
  TINYRACK_DART_PACKAGES_REF: 866a29af27a9f3e077b1dd905f2f79d7ca2c2769
  # wrangler-action defaults to 3.90.0, which predates Workers static assets
  # and rejects an `assets` config for having no script entry-point.
  WRANGLER_VERSION: 4.118.0
  APPIMAGETOOL_SHA256: >-
    a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: >-
    3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled merge-queue check reads as a failure and ejects the pull
  # request from the queue, so those runs always finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') &&
    github.event_name != 'workflow_dispatch' &&
    github.event_name != 'merge_group' }}

jobs:
  # Every job below installs a 1.7-2.1 GB Flutter SDK, and none of that is
  # prunable: the cached blob measures the same as the published archive on
  # every host (Windows 1.81 GB against 1.8, macOS 2.08 against 2.1, Linux 1.69
  # against 1.5), so it is the pristine SDK rather than precache bloat. The
  # per-job cost is therefore fixed, and this job exists to decide how many
  # jobs have to pay it: it selects the fast PR scope and skips the whole set
  # for a documentation-only diff.
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      cli_matrix: ${{ steps.scope.outputs.cli_matrix }}
      mobile_matrix: ${{ steps.scope.outputs.mobile_matrix }}
      dart_scopes_rest: ${{ steps.scope.outputs.dart_scopes_rest }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Anything that is not a pull request keeps the full scope, so it
          # never has to be decided from a diff.
          verification_scope=full
          if [ -n "${PR_NUMBER}" ]; then
            if files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate --jq '.[].filename')"; then
              verification_scope="$(
                printf '%s\n' "$files" |
                  dart packages/tinest_quality/bin/ci_scope.dart
              )"
            else
              echo "::warning::Could not read the PR file list; using full scope"
            fi
          fi

          docs_only=false
          if [ "$verification_scope" = "docs-only" ]; then
            docs_only=true
          fi

          # Every Dart package except the one that gets a shard to itself.
          # Read from the workspace list rather than repeated in the matrix, so
          # a new package joins the `rest` shard instead of going untested.
          packages=.github/dart-packages.json
          shard_alone="$(jq -r '.shardAlone' "$packages")"
          scopes_rest="$(jq -r --arg alone "$shard_alone" \
            '[.packages[] | select(. != $alone) | "--scope=" + .] | join(" ")' \
            "$packages")"
          if [ -z "$scopes_rest" ]; then
            echo "::error::Resolved no packages for the rest shard"
            exit 1
          fi

          matrices=.github/ci-matrices.json
          {
            echo "scope=$verification_scope"
            echo "docs_only=$docs_only"
            echo "cli_matrix=$(jq -c '.cli' "$matrices")"
            echo "mobile_matrix=$(jq -c '.mobile' "$matrices")"
            echo "dart_scopes_rest=$scopes_rest"
          } >> "$GITHUB_OUTPUT"

  static-linux:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run tinest_quality _static-checks
          --report=build/quality/static.json
      - name: Validate the workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timing-static-linux
          path: build/quality/static.json
          if-no-files-found: error

  generated-linux:
    name: Generated sources
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope != 'relay-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run tinest_quality generate --check
          --report=build/quality/generated.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timing-generated-linux
          path: build/quality/generated.json
          if-no-files-found: error

  # Pull-request pushes need a short feedback loop while agents are still
  # iterating. The merge queue runs the coverage and cross-platform suites
  # against the candidate commit, so PRs run the same Dart packages once on
  # Linux without coverage instrumentation.
  fast-dart-tests-linux:
    name: Fast Dart tests (${{ matrix.shard }})
    needs: changes
    if: github.event_name == 'pull_request' &&
      needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: daemon
            scopes: --scope=daemon
          - shard: rest
            scopes: ${{ needs.changes.outputs.dart_scopes_rest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run tinest_quality _test-dart ${{ matrix.scopes }}
          --report=build/quality/fast-dart-tests.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timing-fast-dart-${{ matrix.shard }}
          path: build/quality/fast-dart-tests.json
          if-no-files-found: error

  fast-flutter-tests-linux:
    name: Fast Flutter tests (${{ matrix.package }})
    needs: changes
    if: github.event_name == 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope != 'relay-only'
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: app
          - package: desktop_app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run tinest_quality _test-flutter
          --scope=${{ matrix.package }}
          --report=build/quality/fast-flutter-${{ matrix.package }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timing-fast-flutter-${{ matrix.package }}
          path: build/quality/fast-flutter-${{ matrix.package }}.json
          if-no-files-found: error

  # These two re-run on macOS and Windows what `coverage-dart-linux` and
  # `coverage-flutter-linux` already run on Linux; only the host differs. They
  # were 68% of the bill, so they moved to the merge queue, which still gates
  # `main`. Coverage is collected on Linux in that same full candidate run.
  #
  # They stay two jobs. Merging them to pay `setup-flutter` once was measured
  # and reverted: on Windows the suites take 7.6 and 4.4 minutes, so one job
  # serialises them into 15.6 and the queue run went 7.7 -> 18.2 minutes,
  # against a setup that now costs under 2 minutes to repeat.
  # `daemon` is 88 of the workspace's ~122 suites, and the slot allocator has to
  # keep one slot per package for every package in the same command. On a
  # four-core hosted Windows runner that left daemon running fully serial: it
  # spent 454 of this job's 454 seconds while the other seven finished inside a
  # minute. Splitting it into its own shard is what hands it the whole machine.
  dart-tests:
    name: Dart tests (${{ matrix.os }}, ${{ matrix.shard }})
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS-only Dart behaviour is exercised by the nightly workflow;
          # Windows keeps every Dart change gated on a non-Linux host.
          - os: windows-2025
            shard: daemon
            scopes: --scope=daemon
          - os: windows-2025
            shard: rest
            scopes: ${{ needs.changes.outputs.dart_scopes_rest }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run tinest_quality _test-dart ${{ matrix.scopes }}
          --report=build/quality/dart-tests.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timing-dart-tests-${{ matrix.os }}-${{ matrix.shard }}
          path: build/quality/dart-tests.json
          if-no-files-found: error

  flutter-tests:
    name: Flutter tests (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-26
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run tinest_quality _test-flutter
          --report=build/quality/flutter-tests.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timing-flutter-tests-${{ matrix.os }}
          path: build/quality/flutter-tests.json
          if-no-files-found: error

  coverage-dart-linux:
    name: Dart coverage (${{ matrix.shard }})
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: daemon
            scopes: --scope=daemon
          - shard: rest
            scopes: ${{ needs.changes.outputs.dart_scopes_rest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run tinest_quality _coverage-dart ${{ matrix.scopes }}
          --report=build/quality/coverage-dart.json
      # Only the packages this shard actually ran: coverage-check reads the
      # thresholds per package, so naming one with no coverage data here would
      # fail the shard rather than the package.
      - name: Enforce Dart package coverage
        run: >-
          dart run tinyrack_workspace coverage-check --line=90 --branch=80
          ${{ matrix.scopes }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timing-coverage-dart-${{ matrix.shard }}
          path: build/quality/coverage-dart.json
          if-no-files-found: error

  coverage-flutter-linux:
    name: Flutter coverage
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope != 'relay-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run tinest_quality _coverage-flutter
          --report=build/quality/coverage-flutter.json
      - run: >-
          dart run tinyrack_workspace coverage-check --line=90 --branch=80
          --scope=app
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timing-coverage-flutter-linux
          path: build/quality/coverage-flutter.json
          if-no-files-found: error

  relay-coverage-linux:
    name: Relay coverage
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope == 'relay-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run tinest_quality _coverage-dart --scope=relay
          --report=build/quality/coverage-relay.json
      - run: >-
          dart run tinyrack_workspace coverage-check --line=90 --branch=80
          --scope=relay
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timing-coverage-relay-linux
          path: build/quality/coverage-relay.json
          if-no-files-found: error

  relay-smoke-linux:
    name: Relay image smoke
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope == 'relay-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: docker build --file packages/relay/Dockerfile --tag coder-relay:smoke .
      - name: Smoke the built relay and graceful shutdown
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force coder-relay-smoke >/dev/null 2>&1 || true
            rm -f relay-smoke.ready relay-smoke.log
          }
          trap cleanup EXIT
          docker run --detach --name coder-relay-smoke \
            --publish 127.0.0.1:18080:8080 coder-relay:smoke
          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready \
              >/dev/null; then
              break
            fi
            sleep 0.25
          done
          dart run packages/relay/tool/smoke_relay.dart \
            http://127.0.0.1:18080 relay-smoke.ready \
            >relay-smoke.log 2>&1 &
          smoke_pid=$!
          for _ in $(seq 1 80); do
            test -f relay-smoke.ready && break
            sleep 0.25
          done
          test -f relay-smoke.ready
          docker stop --time 5 coder-relay-smoke >/dev/null
          wait "$smoke_pid"
          test "$(docker inspect --format '{{.State.ExitCode}}' \
            coder-relay-smoke)" = "0"

  debug-e2e-linux:
    name: Linux Debug E2E (${{ matrix.shard }})
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope != 'relay-only'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: daemon-workspace
            scenario: daemon-workspace
          - shard: project-worktree
            scenario: project-worktree
          - shard: plugin-harness
            scenario: plugin-harness
          - shard: relay
            scenario: relay
          - shard: conversation-adversity
            scenario: conversation-adversity
          - shard: conversation-history
            scenario: conversation-history
          - shard: conversation-mcp
            scenario: conversation-mcp
          - shard: conversation
            scenario: conversation
          - shard: provider
            scenario: provider
          - shard: settings-desktop
            scenario: settings-desktop
          - shard: desktop-shell
            scenario: desktop-shell
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/install-linux-desktop-deps
        with:
          extra-packages: xvfb
      - run: dart pub get --enforce-lockfile
      - run: >-
          dart run packages/desktop_app/tool/run_desktop_e2e.dart
          --scenario=${{ matrix.scenario }}
          --jobs=2
          --report=build/e2e-${{ matrix.scenario }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug-e2e-${{ matrix.scenario }}
          path: build/e2e-${{ matrix.scenario }}.json

  linux-ibus-terminal-e2e:
    name: Linux IBus Terminal E2E
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope != 'relay-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/install-linux-desktop-deps
        with:
          extra-packages: >-
            ibus ibus-gtk3 ibus-hangul xdotool xclip dbus-x11 xvfb scrot
            x11-utils
      - name: Run terminal_ibus_e2e_test.dart through the embedded PTY
        env:
          GDK_BACKEND: x11
          GTK_IM_MODULE: ibus
          IBUS_USE_PORTAL: '0'
          XMODIFIERS: '@im=ibus'
          TINYRACK_TINEST_ALLOW_MULTIPLE_INSTANCES: '1'
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/tinest-ibus-config"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/tinest-ibus-runtime"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR" \
            "$GITHUB_WORKSPACE/ibus-terminal-artifacts"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a dbus-run-session -- \
            bash packages/desktop_app/tool/run_linux_ibus_terminal_e2e.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-ibus-terminal-e2e
          path: ibus-terminal-artifacts
          if-no-files-found: warn

  mobile-debug-build:
    name: Mobile Debug Build (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope != 'relay-only'
    strategy:
      fail-fast: false
      # Android and iOS share one merge-candidate job body; the entries live in
      # `.github/ci-matrices.json`.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.mobile_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - name: Set up Gradle cache
        if: matrix.gradle_cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
      - run: dart pub get --enforce-lockfile
      - run: ${{ matrix.command }}
        working-directory: packages/app
      - name: Verify the mobile artifact excludes embedded SQLite
        shell: bash
        run: |
          if [[ "${{ matrix.gradle_cache }}" == "true" ]]; then
            if unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -Ei '(^|/)(lib)?sqlite3[^/]*$'; then
              echo 'Android artifact contains an embedded SQLite native asset.' >&2
              exit 1
            fi
          else
            ios_app_count="$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
            if [[ "$ios_app_count" -ne 1 ]]; then
              echo "Expected one iOS app bundle, found $ios_app_count." >&2
              exit 1
            fi
            ios_app="$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
            if find "$ios_app" -iname '*sqlite3*' -print -quit | grep -q .; then
              echo 'iOS artifact contains an embedded SQLite native asset.' >&2
              exit 1
            fi
          fi
        working-directory: packages/app

  desktop-debug-build:
    name: Desktop Debug Build (${{ matrix.os }})
    needs: changes
    # Same argument as `cross-platform-tests`: a macOS and Windows Debug build
    # is worth blocking a merge on, not worth rebuilding on every push to a
    # pull request branch.
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            command: flutter build macos --debug -t lib/main.dart
          - os: windows-2025
            command: flutter build windows --debug -t lib/main.dart
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: ${{ matrix.command }}
        working-directory: packages/desktop_app

  web-build:
    name: Web Build
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope != 'relay-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      # A dart:io import reaching the web entrypoint only fails here, so the
      # merge candidate compiles Web rather than discovering it at release.
      - run: dart run melos build:web:release
      - uses: actions/upload-artifact@v7
        with:
          name: web-assets
          retention-days: 7
          path: packages/app/build/web
          if-no-files-found: error

  cli-verify:
    name: CLI Verify (${{ matrix.target }})
    needs: changes
    if: github.event_name != 'pull_request' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.scope == 'full'
    # `build-cli` only runs on a tag or a manual dispatch. Two release-path
    # breakages once reached main without this verification: a workspace
    # resolution failure and a stale smoke-test flag order. The merge candidate
    # therefore builds all four release targets before `main` advances.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.cli_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # `macos-x64` builds on an arm64 hosted runner through an x86_64 SDK,
      # which runs there under Rosetta 2. Dart compiles for the architecture it runs
      # as, and `dart build cli` has no cross-architecture option, so the SDK
      # is the only lever. Keeping it here means no quality job needs a hosted
      # Intel runner, and hosted macOS allows five concurrent jobs, so that one
      # job could serialise the merge gate on its own.
      - uses: ./.github/actions/setup-flutter
        with:
          architecture: ${{ matrix.sdk_arch }}
      - run: dart pub get --enforce-lockfile
      - uses: ./.github/actions/build-cli-bundle
        with:
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
      # Signing, archiving, and uploading stay in `build-cli`: they need
      # secrets a fork pull request never receives, and produce artifacts only
      # a release consumes.
      - uses: ./.github/actions/smoke-cli-bundle
        with:
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - changes
      - static-linux
      - generated-linux
      - fast-dart-tests-linux
      - fast-flutter-tests-linux
      - dart-tests
      - flutter-tests
      - coverage-dart-linux
      - coverage-flutter-linux
      - relay-coverage-linux
      - relay-smoke-linux
      - debug-e2e-linux
      - linux-ibus-terminal-e2e
      - mobile-debug-build
      - desktop-debug-build
      - web-build
      - cli-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        # A job scoped out by event or by diff reports `skipped`, which is a
        # pass. `changes` is the one job that cannot be: it decides the scope,
        # so if it fails every other job skips and the gate would wave through
        # a run that verified nothing.
        run: >-
          jq -e 'all(.[]; .result == "success" or .result == "skipped")
          and (.changes.result == "success")' <<< "$QUALITY_RESULTS"

  build-and-package:
    name: Build & Package (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_release)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutter publishes an SDK only for x64 hosts, so neither an arm64
          # Linux nor an arm64 Windows runner can build one. macOS is the sole
          # platform with an arm64 SDK — and the sole one that can build the
          # other architecture, by running the x86_64 SDK under Rosetta 2.
          - os: ubuntu-24.04
            target: linux-x64
            platform: linux
          - os: macos-26
            sdk_arch: x64
            target: macos-x64
            platform: macos
          - os: macos-26
            target: macos-arm64
            platform: macos
          - os: windows-2025
            target: windows-x64
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Declared at job level so the MSIX step can test it in its own `if`; a
    # step cannot read the env it declares itself.
    env:
      MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
        with:
          architecture: ${{ matrix.sdk_arch }}
      - if: matrix.platform == 'linux'
        uses: ./.github/actions/install-linux-desktop-deps
        with:
          extra-packages: rpm
      - run: dart pub get --enforce-lockfile
      - name: Checkout Tinyrack Dart packages
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/dart-packages
          ref: ${{ env.TINYRACK_DART_PACKAGES_REF }}
          path: .dart_tool/tinyrack-dart-packages
      - name: Resolve shipworld workspace
        run: dart pub get --directory .dart_tool/tinyrack-dart-packages

      - name: Build release bundle
        run: dart run melos build:${{ matrix.platform }}:release

      # --- Linux ---------------------------------------------------------
      - name: Resolve appimagetool and nfpm
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          curl --fail --location --output nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          echo "${NFPM_SHA256}  nfpm.deb" | sha256sum --check -
          sudo dpkg -i nfpm.deb
          curl --fail --location --output appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum --check -
          chmod +x appimagetool
          echo "APPIMAGETOOL=${GITHUB_WORKSPACE}/appimagetool" >> "$GITHUB_ENV"
      - name: Package Linux artifacts
        if: matrix.platform == 'linux'
        env:
          BUNDLE: packages/desktop_app/build/linux/x64/release/bundle
        run: |
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package linux appimage tinest --input "$BUNDLE" \
            --output dist/Tinest-linux-x64.AppImage --arch x86_64 \
            --tool "${APPIMAGETOOL}"
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package linux deb tinest --input "$BUNDLE" \
            --output dist/tinest-linux-x64.deb --arch amd64
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package linux rpm tinest --input "$BUNDLE" \
            --output dist/tinest-linux-x64.rpm --arch x86_64
          tar -czf dist/Tinest-linux-x64.tar.gz -C "$BUNDLE" .
      - name: Verify the Linux packages install
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          dpkg-deb --contents dist/tinest-linux-x64.deb | grep 'usr/bin/tinest ->'
          rpm -qpl dist/tinest-linux-x64.rpm | grep '/usr/lib/tinest/tinest'
          # A package that builds but cannot install is the failure the
          # rendering tests cannot see, so this installs it rather than only
          # reading it. A clean container is the better test because it holds
          # none of the build host's libraries, so a dependency this
          # package fails to declare fails here instead of passing by accident.
          docker run --rm -v "$PWD/dist:/dist:ro" debian:stable-slim sh -c '
            set -eu
            apt-get update -qq
            apt-get install -y --no-install-recommends /dist/tinest-linux-x64.deb
            test -x /usr/bin/tinest
            dpkg -r tinest
          '

      # --- macOS ---------------------------------------------------------
      # Before signing, not after: a wrong-architecture app that gets signed
      # and notarized costs a full round trip to Apple to find out, and the
      # signature would then vouch for the wrong binary.
      - if: matrix.platform == 'macos'
        uses: ./.github/actions/verify-macos-arch
        with:
          path: packages/desktop_app/build/macos/Build/Products/Release/Tinest.app
          target: ${{ matrix.target }}
      - name: Sign and archive the macOS app
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APP: packages/desktop_app/build/macos/Build/Products/Release/Tinest.app
        run: |
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package macos sign tinest --input "$APP" --app-bundle \
            ${{ !startsWith(github.ref, 'refs/tags/v') && '--skip-notarize' || '' }}
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package macos archive tinest --input "$APP" \
            --output dist/Tinest-${{ matrix.target }}.zip
          codesign --verify --deep --strict "$APP"
      - name: Report the signing identities that were available
        if: failure() && matrix.platform == 'macos'
        # `no identity found` does not say what was found instead, and the
        # identity name is printed in every signed binary, so it is safe to log.
        run: security find-identity -v -p codesigning || true

      # --- Windows -------------------------------------------------------
      - name: Build the Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path packages/desktop_app/pubspec.yaml `
            -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value.Split('+')[0]
          $bundle = "$PWD\packages\desktop_app\build\windows\${{ matrix.arch }}\runner\Release"
          $runtimeDlls = @(
            'msvcp140.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll'
          )
          foreach ($runtimeDll in $runtimeDlls) {
            $runtimePath = Join-Path $bundle $runtimeDll
            if (-not (Test-Path -LiteralPath $runtimePath)) {
              throw "Windows release bundle is missing app-local runtime: $runtimeDll"
            }
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DAppArch=${{ matrix.arch }}" `
            "/DSourceDir=$bundle" `
            "/DOutputDir=$PWD\dist" `
            "$PWD\packages\desktop_app\windows\installer\tinest.iss"

          $installer = "$PWD\dist\Tinest-setup-win-${{ matrix.arch }}.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP 'tinest-installer-smoke'
          $installProcess = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/CURRENTUSER',
            "/DIR=$installRoot"
          ) -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Windows installer smoke test failed with exit code $($installProcess.ExitCode)"
          }
          foreach ($installedFile in @('tinest.exe') + $runtimeDlls) {
            $installedPath = Join-Path $installRoot $installedFile
            if (-not (Test-Path -LiteralPath $installedPath)) {
              throw "Windows installer omitted required file: $installedFile"
            }
          }
      - name: Build the Windows MSIX
        # Skipped until the identity secrets exist. winget takes the Inno
        # Setup installer, so a release without an MSIX is complete; the MSIX
        # is only needed for the Microsoft Store, which is not submitted yet.
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v')
          && env.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          # The publisher has to match the signing certificate subject, so
          # there is no useful default to fall back to.
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package windows msix tinest
          --input packages/desktop_app/build/windows/${{ matrix.arch }}/runner/Release
          --launcher tinest.exe --arch ${{ matrix.arch }}
          --output dist/Tinest-win-${{ matrix.arch }}.msix
          --package-root dist/msix/${{ matrix.arch }}
      - name: Archive the Windows release directory
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive
          -Path packages/desktop_app/build/windows/${{ matrix.arch }}/runner/Release/*
          -DestinationPath dist/Tinest-${{ matrix.target }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tinest-${{ matrix.target }}
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.msix
          if-no-files-found: error

  build-android-release:
    name: Build Android Release
    if: startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
      - run: dart pub get --enforce-lockfile
      - name: Restore Android signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: ${name}" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/tinest-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > packages/app/android/key.properties
      - name: Build the signed Android release artifacts
        run: |
          flutter build apk --release -t lib/main_mobile.dart
          flutter build appbundle --release -t lib/main_mobile.dart
        working-directory: packages/app
      - name: Verify and stage the signed Android release artifacts
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner \
            | sort -V | tail -n 1)"
          test -n "$apksigner"
          apk="packages/app/build/app/outputs/flutter-apk/app-release.apk"
          aab="packages/app/build/app/outputs/bundle/release/app-release.aab"
          "$apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify -verbose -certs "$aab"
          mkdir -p dist
          cp "$apk" dist/Tinest-android-universal.apk
          cp "$aab" dist/Tinest-android-play.aab
      - name: Remove Android signing material
        if: always()
        run: rm -f packages/app/android/key.properties
          "$RUNNER_TEMP/tinest-release.jks"
      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tinest-android
          retention-days: 7
          path: |
            dist/Tinest-android-universal.apk
            dist/Tinest-android-play.aab
          if-no-files-found: error

  deploy-web:
    name: Deploy Web
    needs:
      - quality-gate
      - web-build
      - build-and-package
      - build-cli
    # The hosted client is one of the application release artifacts. Merge
    # candidates compile it through `web-build` without publishing.
    if: always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.quality-gate.result == 'success' &&
      needs.web-build.result == 'success' &&
      needs.build-and-package.result == 'success' &&
      needs.build-cli.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: packages/app/build/web
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          # Read from either scope so the deployment does not depend on which
          # organisation tab the credentials live in. A secret is preferred
          # because only a secret is masked in logs.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN ||
            vars.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID ||
            vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/app
          command: deploy

  build-cli:
    name: Build CLI (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_release)
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CLI is plain Dart, but it shares a pub workspace with
          # `app`, so resolving it needs the Flutter SDK and the job is
          # held to the platforms Flutter publishes one for. That rules out
          # Linux arm64, which is why `shipworld.yaml` lists the three
          # platforms below under `homebrew.platforms`.
          - os: ubuntu-24.04
            target: linux-x64
            platform: linux
          - os: macos-26
            sdk_arch: x64
            target: macos-x64
            platform: macos
          - os: macos-26
            target: macos-arm64
            platform: macos
          - os: windows-2025
            target: windows-x64
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Flutter rather than a standalone Dart SDK: `dart pub get` resolves the
      # whole workspace, and `app` pulls `flutter`, `flutter_test`, and
      # `integration_test` from the Flutter SDK. The pinned Flutter bundles the
      # same Dart this job used to install directly.
      - uses: ./.github/actions/setup-flutter
        with:
          architecture: ${{ matrix.sdk_arch }}
      - run: dart pub get --enforce-lockfile
      - name: Checkout Tinyrack Dart packages
        if: matrix.platform == 'macos'
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/dart-packages
          ref: ${{ env.TINYRACK_DART_PACKAGES_REF }}
          path: .dart_tool/tinyrack-dart-packages
      - name: Resolve shipworld workspace
        if: matrix.platform == 'macos'
        run: dart pub get --directory .dart_tool/tinyrack-dart-packages

      - uses: ./.github/actions/build-cli-bundle
        with:
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}

      - name: Sign and notarize the macOS bundle
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        # Every bundled dylib is signed before the executable that loads them;
        # signing the executable first would invalidate it.
        run: |
          bundle="dist/tinest-cli-${{ matrix.target }}"
          for library in "$bundle"/lib/*; do
            dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package macos sign tinest-cli \
              --input "$library" --skip-notarize
          done
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package macos sign tinest-cli \
            --input "$bundle/bin/lua-tool-runtime-host" --skip-notarize
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package macos sign tinest-cli \
            --input "$bundle/bin/tinest-cli" \
            ${{ !startsWith(github.ref, 'refs/tags/v') && '--skip-notarize' || '' }}
          codesign --verify --strict "$bundle/bin/tinest-cli"
          codesign --verify --strict "$bundle/bin/lua-tool-runtime-host"

      # After signing, so what runs here is the artifact that ships.
      - uses: ./.github/actions/smoke-cli-bundle
        with:
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}

      - name: Archive the CLI bundle
        shell: bash
        # Every channel now receives an archive, because the executable needs
        # the sibling `lib/` directory that carries sqlite3 and the PTY library.
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a "tinest-cli-${{ matrix.target }}.zip" \
              "tinest-cli-${{ matrix.target }}/*"
          else
            tar -czf "tinest-cli-${{ matrix.target }}.tar.gz" \
              "tinest-cli-${{ matrix.target }}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tinest-cli-${{ matrix.target }}
          retention-days: 7
          path: |
            dist/tinest-cli-${{ matrix.target }}.tar.gz
            dist/tinest-cli-${{ matrix.target }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs:
      - build-and-package
      - build-android-release
      - build-cli
      - quality-gate
      - deploy-web
    if: always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.build-and-package.result == 'success' &&
      needs.build-android-release.result == 'success' &&
      needs.build-cli.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      needs.deploy-web.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Checkout Tinyrack Dart packages
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/dart-packages
          ref: ${{ env.TINYRACK_DART_PACKAGES_REF }}
          path: .dart_tool/tinyrack-dart-packages
      - run: dart pub get --directory .dart_tool/tinyrack-dart-packages

      - name: Verify the tag matches the app version
        run: dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart release verify tinest

      - name: Create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: tinest-*
          path: release-assets
          merge-multiple: true

      - name: Upload the release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber

  publish-homebrew:
    name: Publish Homebrew
    needs: publish-release
    if: always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Checkout Tinyrack Dart packages
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/dart-packages
          ref: ${{ env.TINYRACK_DART_PACKAGES_REF }}
          path: .dart_tool/tinyrack-dart-packages
      - run: dart pub get --directory .dart_tool/tinyrack-dart-packages
      - uses: actions/download-artifact@v8
        with:
          name: tinest-macos-arm64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: tinest-cli-*
          path: cli-assets
          merge-multiple: true

      - name: Generate the Homebrew Cask
        run: |
          url="https://github.com/${{ github.repository }}/releases/download"
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package homebrew cask tinest \
            --archive release-assets/Tinest-macos-arm64.zip \
            --url "${url}/${GITHUB_REF_NAME}/Tinest-macos-arm64.zip" \
            --output release-assets/tinest.rb

      - name: Generate the Homebrew Formula
        # `tinest-cli` declares a directory payload, so shipworld reads the four
        # `.tar.gz` bundles already attached to this release and renders a
        # Formula that installs them into `libexec` and symlinks the launcher.
        run: dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package homebrew formula
          tinest-cli --artifacts-dir cli-assets
          --output release-assets/tinest-cli.rb

      - name: Checkout the Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update the Homebrew tap
        run: |
          mkdir -p homebrew-tap/Casks homebrew-tap/Formula
          cp release-assets/tinest.rb homebrew-tap/Casks/tinest.rb
          cp release-assets/tinest-cli.rb homebrew-tap/Formula/tinest-cli.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tinest.rb Formula/tinest-cli.rb
          git commit -m "Update tinest and tinest-cli to ${GITHUB_REF_NAME}" ||
            echo "No changes to commit"
          git push

  publish-winget:
    name: Publish WinGet
    needs: publish-release
    if: always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-release.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Submit the WinGet manifest update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: .github/scripts/publish-winget.ps1 -ReleaseTag $env:GITHUB_REF_NAME
