<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by the `--base-href` argument to `flutter build`. The app is
    served from the root of its own origin, so the default is correct.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Local-first AI coding agent with an always-on daemon.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tinest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tinest</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">

  <!--
    Painted before the Flutter engine is downloaded, which no Dart code can
    cover. The colors match `manifest.json` and the boot splash Dart renders
    once the engine is up; this file is outside the tinyrack_ui build, so
    there is no token to reference here.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #0a0a0a;
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0a0a0a;
      opacity: 1;
      transition: opacity 150ms ease-out;
    }

    #boot-splash[data-loaded] {
      opacity: 0;
    }

    /* The web overlay and Dart splash both render a 64px mark. Keep these
       dimensions aligned so the mark does not jump during the handoff. */
    #boot-splash img {
      width: 64px;
      height: 64px;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <img src="icons/Icon-192.png" alt="">
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
