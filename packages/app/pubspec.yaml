name: app
description: Cross-platform GUI for Tinest.
publish_to: none
version: 0.10.0+13
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  client: ^0.1.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  cupertino_ui: ^1.0.0
  dropwell:
    git:
      url: https://github.com/tinyrack-net/flutter-packages.git
      ref: c21627dcd525f899223ac584a931c72ddf6f2b12
      path: packages/dropwell
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: 3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: any
  launch_at_startup: ^0.5.1
  lucide_flutter: ^1.25.0
  # `MarkdownElementBuilder` hands out `markdown` AST nodes, so a custom block
  # renderer has to name the package it is given.
  markdown: ^7.3.1
  material_ui: ^1.0.0
  meta: ^1.17.0
  mobile_scanner: ^7.4.0
  path: ^1.9.1
  protocol: ^0.1.0
  riverpod_annotation: 4.0.3
  share_plus: ^12.0.2
  shared_preferences: ^2.5.4
  termworld:
    git:
      url: https://github.com/tinyrack-net/flutter-packages.git
      ref: a2d673366e486ea61577b0ed520dcb1633b56815
      path: packages/termworld
  tinyrack_ui:
    git:
      url: https://github.com/tinyrack-net/design.git
      ref: ffe24ffe002055a34daa5e675bca732cb67db8bb
      path: packages/ui_flutter
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: 2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0
  integration_test:
    sdk: flutter
  relay_protocol: ^0.1.0
  riverpod_generator: 4.0.4
  test: ^1.31.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # The boot splash paints the brand mark before the app tree exists.
    - assets/brand/tinest-256.png

# Regenerate launcher icons from the platform-specific Tinyrack brand assets.
# Edit the icon upstream in the design repository rather than retouching any
# generated output here.
flutter_launcher_icons:
  image_path: assets/brand/tinest-1024.png
  image_path_android: assets/brand/tinest-launcher-icon-1024.png
  image_path_ios: assets/brand/tinest-launcher-icon-1024.png
  android: true
  # Android supplies the dark tile and masks the tileless foreground itself.
  adaptive_icon_background: "#0a0a0a"
  adaptive_icon_foreground: assets/brand/tinest-adaptive-foreground-1024.png
  ios: true
  # App Store rejects launcher icons with an alpha channel.
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/tinest-1024.png
    background_color: "#0a0a0a"
    theme_color: "#0a0a0a"
