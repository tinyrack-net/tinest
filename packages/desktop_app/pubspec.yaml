name: desktop_app
description: Desktop composition root for Tinest and its embedded daemon.
publish_to: none
version: 0.10.0+13
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  app: ^0.10.0
  daemon: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  agent: ^0.1.0
  client: ^0.1.0
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: acd0bdf348e8a8a1886c66e65207fcd3087f7037
      path: packages/cliweave
  dropwell:
    git:
      url: https://github.com/tinyrack-net/flutter-packages.git
      ref: c21627dcd525f899223ac584a931c72ddf6f2b12
      path: packages/dropwell
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: 3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  material_ui: ^1.0.0
  path: ^1.9.1
  protocol: ^0.1.0
  relay: ^0.6.0
  relay_protocol: ^0.1.0
  shared_preferences: ^2.5.4
  shelf: ^1.4.2
  termworld:
    git:
      url: https://github.com/tinyrack-net/flutter-packages.git
      ref: a2d673366e486ea61577b0ed520dcb1633b56815
      path: packages/termworld
  test: ^1.31.0
  tinyrack_ui:
    git:
      url: https://github.com/tinyrack-net/design.git
      ref: ffe24ffe002055a34daa5e675bca732cb67db8bb
      path: packages/ui_flutter

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/brand/tinest-256.png

flutter_launcher_icons:
  image_path: assets/brand/tinest-1024.png
  macos:
    generate: true
    image_path: assets/brand/tinest-1024.png
  windows:
    generate: true
    image_path: assets/brand/tinest-1024.png
    icon_size: 256
