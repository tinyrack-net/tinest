name: desktop_app
description: Desktop composition root for Tinest and its embedded daemon.
publish_to: none
version: 0.11.0+14
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  app: ^0.11.0+14
  daemon: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  agent: ^0.1.0
  client: ^0.1.0
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 5da5311a53bc2cf401f4bc8efb97518adeeced32
      path: packages/cliweave
  dropwell:
    git:
      url: https://github.com/tinyrack-net/flutter-packages.git
      ref: 5f3a5025f9986a1b352c91225771e451281a9a73
      path: packages/dropwell
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.4.3
  # Keep aligned with app; launch_at_startup still requires win32 5.x.
  flutter_secure_storage: ^10.3.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  material_ui: ^1.2.0
  path: ^1.9.1
  protocol: ^0.1.0
  relay: ^0.6.0
  relay_protocol: ^0.1.0
  shared_preferences: ^2.5.5
  shelf: ^1.4.2
  termworld:
    git:
      url: https://github.com/tinyrack-net/flutter-packages.git
      ref: 5f3a5025f9986a1b352c91225771e451281a9a73
      path: packages/termworld
  test: ^1.31.1
  tinyrack_ui:
    git:
      url: https://github.com/tinyrack-net/design.git
      ref: bb4558236b31c3db4369136090a6877dadeb492d
      path: packages/ui_flutter

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/brand/tinest-256.png

flutter_launcher_icons:
  image_path: assets/brand/tinest-1024.png
  macos:
    generate: true
    image_path: assets/brand/tinest-1024.png
  windows:
    generate: true
    image_path: assets/brand/tinest-1024.png
    icon_size: 256
