name: tinest_workspace
description: Tinest monorepo.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/*

dev_dependencies:
  dependency_validator: ^5.0.6
  # flutter_launcher_icons 0.14.4 requires cli_util ^0.4.1; Melos 8 requires ^0.5.0.
  melos: 7.8.1
  tinest_quality: ^0.1.0
  very_good_analysis: ^10.3.0

melos:
  scripts:
    generate:
      run: dart run tinest_quality generate
    test:
      run: dart run tinest_quality test
    verify:
      run: dart run tinest_quality verify
    verify:debug:
      run: dart run tinest_quality e2e
    run:daemon:
      # Built, not `dart run`: the CLI hosts the daemon and links the sqlite3
      # and PTY code assets, which only `dart build cli` produces. Under `dart
      # run` the build hooks never execute and startup fails on a missing
      # `sqlite3_initialize`.
      run: dart run melos build:cli && dist/bundle/bin/tinest_cli daemon start
      stdio: inherit
    run:cli:
      # Built for the same reason as `run:daemon`.
      run: dart run melos build:cli && dist/bundle/bin/tinest_cli
      stdio: inherit
    build:cli:
      # `dart build cli` rather than `dart compile exe`: the CLI now hosts the
      # daemon, so it links sqlite3 and the PTY code assets and ships as
      # `dist/bundle/bin` plus `dist/bundle/lib`.
      run: dart build cli -t packages/cli/bin/tinest_cli.dart -o dist && cd packages/daemon && dart run lua_tool_runtime:stage --destination ../../dist/bundle/bin
    run:desktop:
      # `stdio: inherit` gives flutter run a real terminal so r/R/q work; it is
      # incompatible with melos exec, hence the explicit package directory.
      run: cd packages/desktop_app && flutter run -t lib/main.dart
      stdio: inherit
    run:mobile:
      run: cd packages/app && flutter run -t lib/main_mobile.dart
      stdio: inherit
    build:linux:
      run: dart run melos exec --scope=desktop_app -- flutter build linux --debug -t lib/main.dart
    build:android:
      run: dart run melos exec --scope=app -- flutter build apk --debug -t lib/main_mobile.dart
    build:macos:
      run: dart run melos exec --scope=desktop_app -- flutter build macos --debug -t lib/main.dart
    build:windows:
      run: dart run melos exec --scope=desktop_app -- flutter build windows --debug -t lib/main.dart
    build:web:
      run: dart run melos exec --scope=app -- flutter build web -t lib/main_web.dart
    build:web:release:
      run: dart run melos exec --scope=app -- flutter build web --release -t lib/main_web.dart
    build:linux:release:
      run: dart run melos exec --scope=desktop_app -- flutter build linux --release -t lib/main.dart
    build:macos:release:
      run: dart run melos exec --scope=desktop_app -- flutter build macos --release -t lib/main.dart
    build:windows:release:
      run: dart run melos exec --scope=desktop_app -- flutter build windows --release -t lib/main.dart
